plugins {
    id "java"
}

group = "betterlogisticsspeed"
version = "1.1.0"

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}

def mindustryVersion = (findProperty("mindustryVersion") ?: "v154.2").toString()

dependencies {
    compileOnly "com.github.Anuken.MindustryJitpack:core:$mindustryVersion"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_1_9)) {
        options.release.set(8)
    }
}

jar {
    archiveFileName = "betterLogisticsSpeed.jar"
    from(sourceSets.main.output)
    from(projectDir) {
        include "mod.json"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("zipMod", Zip) {
    group = "build"
    description = "Packages a zip artifact for distribution convenience."
    dependsOn tasks.named("jar")
    archiveFileName = "betterLogisticsSpeed.zip"
    destinationDirectory = layout.buildDirectory.dir("libs")
    from({ zipTree(tasks.named("jar").get().archiveFile.get().asFile) })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def distDir = new File(project.projectDir, "dist")
def buildOutDir = new File(rootDir.parentFile, "构建/${project.name}")

tasks.register("copyJarToDist", Copy) {
    dependsOn tasks.named("jar")
    from(tasks.named("jar").flatMap { it.archiveFile })
    into(distDir)
    rename { _ -> "betterLogisticsSpeed.jar" }
    doNotTrackState("Copying into dist is a convenience step; state tracking is unnecessary here.")
}

tasks.register("copyZipToDist", Copy) {
    dependsOn tasks.named("zipMod")
    from(tasks.named("zipMod").flatMap { it.archiveFile })
    into(distDir)
    rename { _ -> "betterLogisticsSpeed.zip" }
    doNotTrackState("Copying into dist is a convenience step; state tracking is unnecessary here.")
}

tasks.register("copyJarToBuildDir", Copy) {
    dependsOn tasks.named("jar")
    from(tasks.named("jar").flatMap { it.archiveFile })
    into(buildOutDir)
    rename { _ -> "betterLogisticsSpeed-${project.version}.jar" }
    doNotTrackState("Copies jar artifact to workspace output folder")
}

tasks.register("copyZipToBuildDir", Copy) {
    dependsOn tasks.named("zipMod")
    from(tasks.named("zipMod").flatMap { it.archiveFile })
    into(buildOutDir)
    rename { _ -> "betterLogisticsSpeed-${project.version}.zip" }
    doNotTrackState("Copies zip artifact to workspace output folder")
}

tasks.named("jar").configure {
    finalizedBy tasks.named("copyJarToDist")
    finalizedBy tasks.named("copyJarToBuildDir")
}

tasks.named("zipMod").configure {
    finalizedBy tasks.named("copyZipToDist")
    finalizedBy tasks.named("copyZipToBuildDir")
}

tasks.register("deploy") {
    group = "build"
    description = "Builds jar+zip artifacts and copies them to dist/build output folders."
    dependsOn tasks.named("jar")
    dependsOn tasks.named("zipMod")
}